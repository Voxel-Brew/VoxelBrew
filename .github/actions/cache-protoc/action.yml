name: Cache protoc
description: Share Gradle's downloaded protoc artifacts between jobs for the same runner platform.
inputs:
  save:
    description: Save the downloaded compiler after Gradle runs.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      if: inputs.save == 'false'
      id: restore
      with:
        path: ~/.gradle/caches/modules-2/files-2.1/com.google.protobuf/protoc
        key: protoc-v1-${{ runner.os }}-${{ runner.arch }}-
        restore-keys: protoc-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Remember restored compiler cache
      if: inputs.save == 'false'
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: echo "PROTOC_RESTORED_KEY=$MATCHED_KEY" >> "$GITHUB_ENV"
    - name: Identify downloaded compilers
      if: inputs.save == 'true'
      id: compiler
      shell: bash
      run: |
        dir="$HOME/.gradle/caches/modules-2/files-2.1/com.google.protobuf/protoc"
        if [[ -d "$dir" ]]; then
          cd "$dir"
          # Gradle artifact paths include the version, content digest and native classifier.
          compilers=$(find . -type f -name '*.exe' | LC_ALL=C sort)
          if [[ -n "$compilers" ]]; then
            digest=$(printf '%s\n' "$compilers" | git hash-object --stdin)
            echo "key=protoc-v1-$RUNNER_OS-$RUNNER_ARCH-$digest" >> "$GITHUB_OUTPUT"
          fi
        fi
    - uses: actions/cache/save@v4
      if: steps.compiler.outputs.key != '' && steps.compiler.outputs.key != env.PROTOC_RESTORED_KEY
      with:
        path: ~/.gradle/caches/modules-2/files-2.1/com.google.protobuf/protoc
        key: ${{ steps.compiler.outputs.key }}
