name: CAD check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: cad-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_PACKAGES_USER: ${{ vars.PACKAGES_USER || github.actor }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
jobs:
  changes:
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Determine check scope
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - id: scope
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BASE..$GITHUB_SHA" ;;
            *) range="" ;;
          esac
          # Unknown paths or an unavailable comparison require the full suite.
          if [[ -n "$range" ]] && git diff --quiet --no-renames "$range" -- . \
              ':(exclude,glob)*.md' ':(exclude,glob)**/README.md' \
              ':(exclude,glob)**/AGENTS.md' ':(exclude,glob)docs/**/*.md' \
              ':(exclude,glob)docs/screenshots/*.png' ':(exclude)LICENSE'; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
  spotbugs:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: SpotBugs (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/cache-protoc
      - name: Check Java member order
        run: ./gradlew --build-cache checkJavaMemberOrder -PbundleSlicers=false
      - name: Check Java sources and analyze application and fixture bytecode
        run: ./gradlew --stacktrace --build-cache basicChecks checkstyleAll :engine:checkExporterFixture -PbundleSlicers=false -x :checkJavaMemberOrder
      - uses: ./.github/actions/cache-protoc
        with:
          save: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs
          retention-days: 3
          path: |
            **/build/reports/spotbugs/
            **/build/reports/checkstyle/
  unit:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Unit tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/cache-protoc
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .tools/bundled-slicers
          key: bundled-slicers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bundle-slicers.py') }}
      - name: Run unit tests
        run: ./gradlew --build-cache test
      - uses: ./.github/actions/cache-protoc
        with:
          save: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 3
          path: |
            **/build/reports/
            **/build/test-results/test/
  format:
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Formatting (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting
        run: ./gradlew --build-cache spotlessCheck
  integration:
    needs: [spotbugs, unit, format]
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Integration tests
    secrets: inherit
    uses: ./.github/workflows/native-check.yml
    with:
      os: ubuntu-24.04
      suite: integrationTest
      artifact-name: integration-ubuntu-24.04
  platform:
    needs: integration
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Platform checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        ui-shard: [1, 2, 3, 4, 5]
        include:
          - os: macos-15-intel
            suite: headlessPackageCheck
            ui-shard: 1
          - os: macos-15-intel
            suite: headlessWorkflowCheck
            ui-shard: 2
    secrets: inherit
    uses: ./.github/workflows/native-check.yml
    with:
      os: ${{ matrix.os }}
      suite: ${{ matrix.suite || (matrix.ui-shard == 1 && 'platformCheck' || ':gui:e2eTest') }}
      artifact-name: platform-${{ matrix.os }}-${{ matrix.ui-shard }}
      archive: ${{ matrix.ui-shard == 1 }}
      ui-shard: ${{ matrix.os == 'macos-15-intel' && 1 || matrix.ui-shard }}
      ui-shard-count: ${{ matrix.os == 'macos-15-intel' && 1 || 5 }}
  full-check:
    name: Full check
    if: ${{ always() && !contains(github.event.head_commit.message, '[migration]') }}
    needs: [changes, spotbugs, unit, format, integration, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          SPOTBUGS_RESULT: ${{ needs.spotbugs.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$FORMAT_RESULT" = success
          case "$FULL" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$SPOTBUGS_RESULT" = "$expected"
          test "$UNIT_RESULT" = "$expected"
          test "$INTEGRATION_RESULT" = "$expected"
          test "$PLATFORM_RESULT" = "$expected"
