name: CAD check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: cad-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_PACKAGES_USER: ${{ vars.PACKAGES_USER || github.actor }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
jobs:
  spotbugs:
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: SpotBugs (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Voxel-Brew/BOM
          path: .tools/bom
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Java member order
        run: ./gradlew --build-cache checkJavaMemberOrder -PbundleSlicers=false
      - name: Check Java sources and analyze application and fixture bytecode
        run: ./gradlew --build-cache basicChecks checkstyleAll :engine:checkExporterFixture -PbundleSlicers=false -x :checkJavaMemberOrder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs
          retention-days: 3
          path: |
            **/build/reports/spotbugs/
            **/build/reports/checkstyle/
  unit:
    needs: spotbugs
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Unit tests and formatting (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Voxel-Brew/BOM
          path: .tools/bom
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .tools/bundled-slicers
          key: bundled-slicers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bundle-slicers.py') }}
      - name: Unit tests and formatting
        run: ./gradlew --build-cache spotlessCheck test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          retention-days: 3
          path: |
            **/build/reports/
            **/build/test-results/test/
  integration:
    needs: spotbugs
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Integration tests
    secrets: inherit
    uses: ./.github/workflows/native-check.yml
    with:
      os: ubuntu-24.04
      suite: integrationTest
      artifact-name: integration-ubuntu-24.04
  platform:
    needs: spotbugs
    if: ${{ !contains(github.event.head_commit.message, '[migration]') }}
    name: Platform checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        ui-shard: [1, 2, 3, 4, 5]
        include:
          - os: macos-15-intel
            suite: headlessPackageCheck
            ui-shard: 1
          - os: macos-15-intel
            suite: headlessWorkflowCheck
            ui-shard: 2
    secrets: inherit
    uses: ./.github/workflows/native-check.yml
    with:
      os: ${{ matrix.os }}
      suite: ${{ matrix.suite || (matrix.ui-shard == 1 && 'platformCheck' || ':gui:e2eTest') }}
      artifact-name: platform-${{ matrix.os }}-${{ matrix.ui-shard }}
      archive: ${{ matrix.ui-shard == 1 }}
      ui-shard: ${{ matrix.os == 'macos-15-intel' && 1 || matrix.ui-shard }}
      ui-shard-count: ${{ matrix.os == 'macos-15-intel' && 1 || 5 }}
  full-check:
    name: Full check
    if: ${{ always() && !contains(github.event.head_commit.message, '[migration]') }}
    needs: [spotbugs, unit, integration, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require SpotBugs, tests, and platform checks to pass
        env:
          SPOTBUGS_RESULT: ${{ needs.spotbugs.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$SPOTBUGS_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$PLATFORM_RESULT" = success
