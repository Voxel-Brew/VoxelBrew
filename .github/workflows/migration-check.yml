name: Repository migration checks
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  GITHUB_PACKAGES_USER: ${{ vars.PACKAGES_USER || github.actor }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[migration]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Java member order
        run: ./gradlew checkJavaMemberOrder
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./gradlew spotlessCheck basicChecks test verifyFrontendIoDependencies -x :checkJavaMemberOrder
