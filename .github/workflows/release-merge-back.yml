name: Release - merge back to master
on:
  push:
    branches: ["release/**"]
  repository_dispatch:
    types: [release-merge-back]
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch to merge (release/A.B.x)"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-merge-back
  cancel-in-progress: false
jobs:
  merge:
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BRANCH: ${{ inputs.branch || github.event.client_payload.branch || github.ref_name }}
      RELEASE_SOURCE: ${{ github.event.client_payload.source || (github.event_name == 'push' && github.sha) || '' }}
    steps:
      # Use trusted default-branch automation, not scripts from the incoming release branch.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          # Git uses checkout's persisted credential to push the merge-back branch.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: changes
        run: node .github/scripts/release.cjs merge-back
      - name: Open or reuse merge-back pull request
        if: steps.changes.outputs.head
        env:
          # The organization restricts PR creation by GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          PR_BRANCH: ${{ steps.changes.outputs.head }}
        run: |
          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base master --head "$PR_BRANCH" --state open --json url --jq '.[0].url')
          if [[ -z "$url" ]]; then
            echo "Prepared branch: https://github.com/$GITHUB_REPOSITORY/compare/master...$PR_BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$PR_BRANCH" \
              --title "Merge $RELEASE_BRANCH changes back into master" \
              --body "Apply release changes from ${PR_BRANCH##*/} while preserving the master development version.")
          fi
          echo "Merge-back pull request: $url" >> "$GITHUB_STEP_SUMMARY"
