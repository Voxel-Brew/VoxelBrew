help.slicer.content=Fügen Sie ein CAD-Bereich in Plattform hinzu und wählen Sie dann seine Bauinstanz aus, um es zu bewegen, zu drehen oder zu verdoppeln.\nSchalten Sie zwischen 2D Top View und 3D Isometrik über dem Platten.Doppelklikken auf die Plattendimensionen, um das Bauvolumen zu bearbeiten.\nProzess kontrolliert Material, Schichthöhung, Wände und Fels. Unterstützt wird Blockern, Antriebsstellen oder feste Unterstützung Volumen an einem Vorfall angeschlossen.\nIn der Arbeit, beginnen Sie mit Schlitz. G-code Standard für die Projektfolie und den Namen. Verwenden Sie den Layer Slider und Rollenfilter, um die resultierenden Pfaden zu überprüfen.\nCtrl + 1 kehrt zum Designer zurück; Ctrl + S speichert das Projekt.
help.designer.content=Erstellen Sie einen Sketch, Zeichnen und Dimension seiner Geometrie, dann beenden Sie den Sketch und extrudieren Sie es.\nVerwenden Sie die Funktionszeitlinie, um frühere Operationen zu überprüfen oder zu bearbeiten.\nCtrl+S — Speichern, Ctrl+Z — Rückgängig, Ctrl+Y — Wiederholen. Ctrl+2 — Projekt speichern und Slicer öffnen.\nSehen Sie Settings > Keyboard-Schnittstellen für die vollständige Schnittliste.
