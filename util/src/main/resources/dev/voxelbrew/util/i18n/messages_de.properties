help.menu-file=Erstellen, öffnen, speichern oder exportieren ein Design.
help.menu-edit=Undo oder redo bearbeiten und managen Designparameter.
help.menu-view=Fügen Sie das Modell an, wählen Sie einen Standardbild oder ändern Sie den Aussehen.
help.menu-settings=Wählen Sie die Anwendungsprache oder überprüfen Sie Updates.
help.new=Start ein leeres Design. Sie können zunächst das aktuelle Design speichern.
help.open=Öffnen Sie ein editierbares .vxb-Design von Ihrem Disk.
help.save=Speichern Sie das aktuelle Design, einschließlich seiner Funktionen und Parameter.
help.save-as=Speichern Sie das Design unter einem anderen Namen oder Ort.
help.export=Wählen Sie einen verfügbaren Dokument oder Geometrie-Exporteur und konfigurieren Sie seine Optionen.
help.export-vxb=Speichern Sie das vollständige bearbeitbare Dokument als VXB-Datei.
help.export-json=Exportieren Sie das vollständige Dokument als Lesbar JSON ohne den aktiven Projekt zu ändern.
help.undo=Undo der letzte verpflichtet edit. Timeline rollback ist unabhängig.
help.redo=Wiederherstellen der letzten Edite.
help.parameters=Erstellen Sie benannte Dimensionen, Formeln und Parameterkonfigurationen für diesen Design.
help.custom-feature=Hinzufügen Sie eine parametrische Operation, die durch einen installierten Feature-Plugin bereitgestellt wird.
