help.designer.title=Ayuda del diseñador
help.slicer.content=Añade un cuerpo CAD en la ubicación, luego seleccione su instancia de construcción para mover, girar o duplicarlo.\nCambiar entre la vista superior 2D y la vista isométrica 3D sobre la placa.\nEl proceso controla el material, la altura de la capa, las paredes y los infiles.Suporte añade bloqueadores, forzadores o volúmenes sólidos adjuntos a una instancia.\nEn el trabajo, comience a deslizarse. G-code Los filtros de rol utilizan el slider de la capa y los filtro de rol para inspeccionar los caminos resultantes.\nCtrl + 1 vuelve a Designer; Ctrl + S salva el proyecto.
help.designer.content=Crea un esquema, dibuja y dimensiones su geometría, luego finaliza el esquema y extrae.\nUtilice la línea de tiempo para inspeccionar o editar las operaciones anteriores.\nCtrl+S — Guardar, Ctrl+Z — Deshacer, Ctrl+Y — Rehacer. Ctrl+2 — guardar el proyecto y abrir el laminador.\nVer Settings > Cortes de teclado para la lista completa de recortes.
