help.menu-file=Créer, ouvrir, économiser ou exporter un design.
help.menu-edit=Undo ou redo édite et gère les paramètres de conception.
help.menu-view=Choisissez un modèle standard ou modifiez l’apparence.
help.menu-settings=Choisissez le langage d’application ou vérifiez les mises à jour.
help.new=Démarrez un design vide. Vous pouvez enregistrer le design actuel d’abord.
help.open=Ouvrez un design .vxb éditable depuis le disque.
help.save=Écrivez le design actuel, y compris ses caractéristiques et paramètres.
help.save-as=Sauver le design sous un nom ou une localisation différente.
help.export=Choisissez un document ou un exportateur de géométrie disponibles et configurez ses options.
help.export-vxb=Sauver le document entier en tant que fichier VXB.
help.export-json=Exporter le document complet comme JSON lisible sans changer le projet actif.
help.undo=Le dernier édit est le Timeline Rollback.
help.redo=Récupérer la dernière édition.
help.parameters=Créer des dimensions nommées, des formules et des configurations de paramètres pour ce design.
help.custom-feature=Ajouter une opération paramétrique fournie par un plugin fonctionnel installé.
help.constrained-sketch=Choisissez un avion d’origine ou un corps plat dans le port, puis dessinez et limitez un sketch 2D.
help.rectangle=Réservez un rectangle en utilisant deux cornes, puis ajuster ses dimensions avant de finir.
help.circle=Dessiner un cercle en utilisant son centre et son rayon, puis ajuster ses dimensions.
help.extrude=Sélectionnez d’abord un profil de sketch, puis donnez-lui une distance d’extraction positive ou négative.
