help.active-configuration=Transfert le ensemble actif de valeurs paramétraires et reconstruire le design.
help.history-cursor=Retourner le marquage pour tourner vers le modèle. Arrow clés pas par les opérations; Accueil et fin à la fin.
help.history-feature=Sélectionnez cette opération pour inspecter ou modifier ses dimensions.
help.timeline-first=Rentrer au départ, avant toute opération de modélisation.
help.timeline-previous=Rappelez-vous une opération de modélisation.Cela ne fait pas partie d’une édition.
