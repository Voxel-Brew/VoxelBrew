help.designer.title=Aide du designer
help.slicer.content=Ajouter un corps CAD dans Placement, puis sélectionnez son instance de construction pour le déplacer, rouler ou le duplicer.\nInterchange entre la vue 2D et la vue isométrique 3D au-dessus de la plaque. double-cliquez sur les dimensions de la plaque pour modifier le volume de construction.\nLe processus contrôle le matériau, la hauteur des couches, les murs et les infiles.Support ajoute des blocs, des forcements ou des volumes de soutien solides attachés à une instance.\nDans Job, commencez à slider. G-code défaut dans la dossier et le nom du projet. Utilisez le slider de couche et les filtres de rôles pour inspecter les chemins résultant.\nCtrl + 1 revient à Designer ; Ctrl + S sauvegarde le projet.
help.designer.content=Créez un sketch, dessinez et dimensionnez sa géométrie, puis terminez le sketch et extrudez-le.\nUtilisez la ligne de temps pour inspecter ou modifier les opérations antérieures.\nCtrl+S — Enregistrer, Ctrl+Z — Annuler, Ctrl+Y — Rétablir. Ctrl+2 — enregistrer le projet et ouvrir le trancheur.\nVoir Settings > Coup de table pour la liste complète.
