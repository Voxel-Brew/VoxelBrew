help.menu-file=Creare, aprire, salvare o esportare un design.
help.menu-edit=Undo o redo editi e gestione dei parametri di progettazione.
help.menu-view=Adattare il modello, scegliere una vista standard o cambiare l’aspetto.
help.menu-settings=Scegli il linguaggio di applicazione o verifica gli aggiornamenti.
help.new=Inizia un design vuoto. puoi salvare il tuo design attuale prima.
help.open=Apri un design .vxb edibile dal disco.
