help.designer.title=Il disegno aiuta
help.slicer.content=Aggiungi un corpo CAD in Posizione, quindi selezionare la sua instanza di costruzione per spostarlo, girarlo o duplicarlo.\nScorrere tra la vista superiore 2D e la vista isometrica 3D sopra il disco.\nIl processo controlla il materiale, l’altezza della striscia, le pareti e gli infili.Support aggiunge blocchi, forciatori o volumi di supporto solidi allegati a un caso.\nInizia a lavorare. G-code utilizza lo slider della striscia e i filtri di ruolo per controllare le rotte risultanti.\nCtrl + 1 ritorna al Designer; Ctrl + S salva il progetto.
help.designer.content=Crea un sketch, disegnare e misurare la sua geometria, poi completare lo sketch ed estrarlo.\nUtilizzare la linea di tempo per controllare o modificare le operazioni precedenti.\nCtrl+S — Salva, Ctrl+Z — Annulla, Ctrl+Y — Ripristina. Ctrl+2 — salvare il progetto e aprire lo slicer.\nVedi Settings > Keyboard Shortcuts per la lista completa di shortcuts.
