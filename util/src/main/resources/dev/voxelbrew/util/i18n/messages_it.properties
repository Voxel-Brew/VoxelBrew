help.printer.content=Scegli una piastra tagliata e un’immatricolazione fisica. Scarica solo il lavoro; La stampa richiede anche un inizio. Pausa, Ristrutturazione e cancellazione controlla il dispositivo selezionato. Configlia le connessioni sotto Immatricolazioni > Configurazione dei dispositivi. Bamboo richiede accesso LAN e un pacchetto OrcaSlicer corrispondente. Chiudere questa finestra non ferma una stampa fisica.

