help.slicer.content=ポジションに CAD ボディを追加し、その構築の例を選択して移動、回転または複製します。\nプレートの上部の2Dトップビューと3Dイソメトリックビューの間を切り替え、構築量を編集するためにプレートサイズをダブルクリックします。\nプロセスは、材料、層の高さ、壁やインフィルを制御します。サポートは、ブロッカー、強化器、または固定サポートボリュームが一つの例に付属します。\n仕事で、スライドを始める。 G-code プロジェクトフォルダーと名前のデフォルトを使用して、結果のパスワードを検証するために、レイヤースライダーと役割フィルターを使用します。\nCtrl + 1 はデザイナーに戻り、Ctrl + S はプロジェクトを保存します。
help.designer.content=スケッチを作成し、その地理を描き、次にスケッチを完成させ、それを抽出します。\n機能タイムラインを使用して、以前の操作を検証または編集します。\nCtrl+S — 保存, Ctrl+Z — 元に戻す, Ctrl+Y — やり直す. Ctrl+2 — プロジェクトを保存してスライサーを開く.\n設定 > キーボードの短縮を表示するには、完全な短縮リストをご覧ください。
