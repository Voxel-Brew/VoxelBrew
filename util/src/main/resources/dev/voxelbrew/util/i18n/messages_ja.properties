formula.textSyntax=文字はデフォルトで表示されます: 幅:5 残ります 幅:5\nパラメーターを評価し、引用テキストに加えます。 使用 + アリスメティックの値とパラメーターを追加する: ="半分: " ($width/2). 引用テキストの内部で「引用マーク」を書きます。\n指定されたパラメーターを選択するために、$をタイプします。
