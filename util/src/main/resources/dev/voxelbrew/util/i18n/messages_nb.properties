help.slicer.content=Legg til en CAD-kropp i plassering, og velg deretter bygginstansen for å flytte den, rotere eller duplisere den.\nSkift mellom 2D toppvisning og 3D isometrisk visning over platen. dobbeltklikk på platt dimensjoner for å redigere byggvolumet.\nProsessstyrer materialet, lagets høyde, vegger og infiler. Støtte legger til blokkerere, forsterkere eller solid støttevolum knyttet til en instans.\nI jobben, begynne å slite. G-code standard til prosjektmappen og navnet. Bruk lagerslider og rollemidler for å sjekke de resulterende veiene.\nCtrl + 1 returnerer til Designer; Ctrl + S sparer prosjektet.
help.designer.content=Skap en skikk, tegne og dimensjon geometri, deretter avslutte skikkingen og ekstrudere den.\nBruk funksjonstidslinjen for å inspisere eller redigere tidligere operasjoner.\nCtrl+S — Lagre, Ctrl+Z — Angre, Ctrl+Y — Gjør om. Ctrl+2 — lagre prosjektet og åpne sliceren.\nSe Innstillinger > Keyboard korthet for fullstendig korthetsliste.
