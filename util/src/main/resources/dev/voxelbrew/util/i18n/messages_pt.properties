help.designer.title=Auxílio do Designer
help.slicer.content=Adicione um corpo CAD em Localização, selecione a sua instância de construção para mover, rotar ou duplicá-lo.\nIntercâmbio entre a vista superior 2D e a vista isométrica 3D acima da placa.\nO processo controla o material, a altura da camada, as paredes e os encantos.O suporte adiciona bloqueadores, forços ou volumes de apoio sólidos ligados a uma instância.\nEm trabalho, comece a esmagar. G-code Use o slider de camada e os filtros de função para verificar os caminhos resultantes.\nCtrl + 1 retorna ao Designer; Ctrl + S salva o projeto.
help.designer.content=Crie um esquema, desenhe e dimensione sua geometria, depois conclua o esquema e extrude.\nUse a linha de tempo para inspecionar ou editar operações anteriores.\nCtrl+S — Guardar, Ctrl+Z — Desfazer, Ctrl+Y — Refazer. Ctrl+2 — guardar o projeto e abrir o fatiador.\nVeja Settings > Keyboard para a lista completa de cortes.
