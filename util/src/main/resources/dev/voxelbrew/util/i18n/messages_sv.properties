help.slicer.content=Lägg till en CAD-kropp i Placering och välj sedan dess bygginstans för att flytta, rotera eller duplicera den.\nSwitch mellan 2D topputseende och 3D isometrisk utseende ovanför plattan. dubbelklicka på plattdimensionerna för att redigera byggvolymen.\nProcessen kontrollerar material, lagerhöjd, väggar och infill. Stöd lägger blockers, ansträngare eller fasta stödvolymer som är anslutna till en instans.\nI jobbet, börja skruva. G-code standard till projektmappen och namnet. Använd lagerslider och rollfilter för att kontrollera de resulterande vägarna.\nCtrl + 1 returnerar till Designer, Ctrl + S sparar projektet.
help.designer.content=Skapa en skiss, måla och dimensionera sin geometri, sedan avsluta skisset och extrudera det. Välj kroppar eller ansikten för att tillämpa modelleringsverktyg.\nAnvänd funktionstidslinjen för att inspektera eller redigera tidigare operationer.\nCtrl+S — Spara, Ctrl+Z — Ångra, Ctrl+Y — Gör om. Ctrl+2 — spara projektet och öppna skivaren.\nSe Inställningar > Keyboard för fullständig kortlista.
