help.slicer.content=在“放置”中添加一个CAD体,然后选择它的构建例子,以移动、旋转或重复。\n交换 2D 顶部视图和 3D 以色列视图在板上。\n过程控制材料、层高度、墙壁和粘贴器,支持添加阻塞器、粘贴器或固定支持量。\n工作,开始滑动。 G-code 默认文件夹和项目名称. 使用层滑板和角色过滤器检查结果的路径。\nCtrl + 1 返回设计师; Ctrl + S 保存项目。
help.designer.content=创建一个绘图,绘制和测量其地质,然后完成绘图并抽出它。\n使用功能时间表检查或编辑以前的操作。\nCtrl+S — 保存, Ctrl+Z — 撤销, Ctrl+Y — 重做. Ctrl+2 — 保存项目并打开切片器.\n查看“设置” > 键盘短片,以便完整的短片列表。
